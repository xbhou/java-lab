services:
  redis:
    image: redis:8.10-alpine
    container_name: java-lab-redis-cache
    ports:
      - "6380:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
